<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Més Enllà del #15M</title>
<script>
  var langs = navigator.languages || [navigator.language || "ca"];
  var lang = langs.find(function (l) { return /^es/i.test(l); }) ? "es"
           : langs.find(function (l) { return /^en/i.test(l); }) ? "en"
           : "ca";
  location.replace("/" + lang + "/index.html");
</script>
</head>
<body></body>
</html>
